- title: "The Alchemist"
  author: "Paulo Coelho"
  published: 1988
  cover: "/images/books/the-alchemist.jpg"
  blurb: "I started reading non-academic books pretty late in life, and this was probably the first one I read. Nothing significant,
                        but a good start to my journey of reading. All I remember is Maktub, which means 'it is written' in Arabic.
                        I don't believe in religion, but I do believe in destiny/maktub."

